<div class="form-container">
  <h1>{{ isEditMode ? 'Edit Product' : 'Add New Product' }}</h1>

  <div class="message success" *ngIf="message">{{ message }}</div>
  <div class="message error" *ngIf="error">{{ error }}</div>

  <form (ngSubmit)="onSubmit()" *ngIf="!loading">
    <div class="form-row">
      <div class="form-group">
        <label for="name">Product Name <span>*</span></label>
        <input type="text" id="name" [(ngModel)]="product.name" name="name" required />
      </div>
      <div class="form-group">
        <label for="brand">Brand <span>*</span></label>
        <input type="text" id="brand" [(ngModel)]="product.brand" name="brand" required />
      </div>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" [(ngModel)]="product.description" name="description" rows="4"></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="category">Category <span>*</span></label>
        <input type="text" id="category" [(ngModel)]="product.category" name="category" required />
      </div>
      <div class="form-group">
        <label for="price">Price (₹) <span>*</span></label>
        <input type="number" id="price" [(ngModel)]="product.price" name="price" required min="0" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="stockQuantity">Stock Quantity <span>*</span></label>
        <input type="number" id="stockQuantity" [(ngModel)]="product.stockQuantity" name="stockQuantity" required min="0" />
      </div>
      <div class="form-group">
        <label for="releaseDate">Release Date</label>
        <input type="date" id="releaseDate" [(ngModel)]="product.releaseDate" name="releaseDate" />
      </div>
    </div>

    <div class="form-group checkbox-group">
      <label>
        <input type="checkbox" [(ngModel)]="product.productAvailable" name="productAvailable" />
        Product Available
      </label>
    </div>

    <div class="form-group">
      <label for="image">Product Image</label>
      <input type="file" id="image" (change)="onFileSelected($event)" accept="image/*" />
      <div class="image-preview" *ngIf="imagePreview">
        <img [src]="imagePreview" alt="Preview" />
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-primary">
        {{ isEditMode ? 'Update Product' : 'Add Product' }}
      </button>
      <button type="button" class="btn-secondary" routerLink="/products">Cancel</button>
    </div>
  </form>

  <div class="loading" *ngIf="loading">Processing...</div>
</div>
